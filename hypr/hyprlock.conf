$font = JetBrainsMono Nerd Font Mono
$accent = rgb(c6,78,dd)
$background = rgb(1b,1b,1b)
$foreground = rgb(dd,dd,dd)
$surface = rgb(2a,2a,2a)
$muted = rgb(aa,aa,aa)
$red = rgb(e0,6c,75)
$yellow = rgb(d1,9a,66)

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/backgrounds/wallpaper.png
    blur_passes = 2
    blur_size = 8
    noise = 0.0
    contrast = 2.0
    brightness = 0.4
    color = $background
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 78
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = $muted
    font_size = 20
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 58
    rounding = 14
    outline_thickness = 5

    outer_color = $accent
    inner_color = $surface
    font_color = $foreground

    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true

    fade_on_empty = false
    hide_input = false

    placeholder_text = <span foreground="##aaaaaa">Password...</span>
    check_color = $accent
    fail_color = $red
    fail_text = <span foreground="##e06c75">Incorrect password ($ATTEMPTS)</span>
    capslock_color = $yellow

    position = 0, -120
    halign = center
    valign = center
}
